<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finama</title>
    <base href="/" />

    <link href="/lib/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/lib/bootstrap-icons/font/bootstrap-icons.min.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#0A1628" />
    <link href="/css/app.css" rel="stylesheet" />
    <link href="/css/finama.css" rel="stylesheet" />
    <link href="/css/auth.css" rel="stylesheet" />
    <link href="/css/finama-brand.css" rel="stylesheet" />
    <link href="favicon.png" rel="icon" type="image/png" />
    <link href="images/logo-icon.svg" rel="icon" type="image/svg+xml" />
    <link href="icon-192.png" rel="apple-touch-icon" />
    <link href="Finama.Web.styles.css" rel="stylesheet" />
    <script>
        window.themeManager = {
            setTheme: (theme) => {
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.setAttribute('data-bs-theme', theme);
                localStorage.setItem('theme', theme);
            },
            getPreferredTheme: () => {
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme) return savedTheme;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
        };
        document.documentElement.setAttribute('data-theme', themeManager.getPreferredTheme());
        document.documentElement.setAttribute('data-bs-theme', themeManager.getPreferredTheme());
    </script>
</head>

<body>
    <div id="app">
        <div class="splash-container">
            <div class="glow-sphere glow-blue"></div>
            <div class="glow-sphere glow-purple"></div>

            <div class="splash-card">
                <div class="splash-logo-wrapper">
                    <img src="images/logo-icon.svg" alt="Finama" />
                </div>

                <h2 class="splash-title">FINAMA</h2>
                <div class="badge-gradient-neon mb-3">Comptabilité simple et sécurisée</div>

                <p class="splash-subtitle">Analyse et synchronisation des journaux comptables...</p>

                <div class="splash-progress-bar">
                    <div class="splash-progress-line"></div>
                </div>

                <span class="splash-footer-text">Connexion sécurisée locale active</span>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script>
        window.downloadFile = (fileName, contentType, base64Data) => {
            const link = document.createElement('a');
            link.download = fileName;
            link.href = `data:${contentType};base64,${base64Data}`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.downloadPdf = (base64String, fileName) => {
            const byteCharacters = atob(base64String);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(link.href);
        };
    </script>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
